version: "3.8"

services:
  proxy:
    build:
      context: ./proxy
    image: istanbul-visa-tinyproxy:local
    container_name: visa-proxy
    ports:
      - "8888:8888"
    restart: unless-stopped
    networks:
      - visa-net

  visa-checker:
    build: .
    container_name: visa-checker
    depends_on:
      - proxy
    environment:
      - TZ=${TZ:-Asia/Istanbul}
      - RUN_MODE=${RUN_MODE:-loop}
      - SOURCE=${SOURCE:-checkvisaslots}
      - API_KEY=${API_KEY}
      - VISA_LOCATIONS=${VISA_LOCATIONS:-ISTANBUL}
      - VISA_CATEGORIES=${VISA_CATEGORIES:-B1/B2}
      - VISA_DURATION_DAYS=${VISA_DURATION_DAYS:-120}
      - REQUIRE_BOTH_CONSULATE_AND_VAC=${REQUIRE_BOTH_CONSULATE_AND_VAC:-false}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - CHECK_JITTER_SECONDS=${CHECK_JITTER_SECONDS:-90}
      - DEDUPE_HOURS=${DEDUPE_HOURS:-6}
      - NOTIFY=${NOTIFY:-true}
      - DRY_RUN=${DRY_RUN:-false}
      - PROXY_URL=${PROXY_URL:-http://proxy:8888}
      - CF_SOLVER_URL=${CF_SOLVER_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN:-}
      - PUSHOVER_USER=${PUSHOVER_USER:-}
      - OFFICIAL_EMAIL=${OFFICIAL_EMAIL:-}
      - OFFICIAL_PASSWORD=${OFFICIAL_PASSWORD:-}
      - DATA_DIR=/app/data
    volumes:
      - ./logs:/var/log
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - visa-net

  # Optional Cloudflare solver — enable with: docker compose --profile cf up -d
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: visa-flaresolverr
    profiles: ["cf"]
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Asia/Istanbul}
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - visa-net

networks:
  visa-net:
    driver: bridge

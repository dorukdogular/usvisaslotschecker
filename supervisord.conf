[supervisord]
logfile=/var/log/supervisord.log
loglevel=info
nodaemon=true
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Preferred: long-running jittered loop (rate-limit friendly)
[program:visa-loop]
command=/usr/local/bin/python /app/visa_slot_checker.py
environment=RUN_MODE="loop"
autostart=true
autorestart=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

; Optional cron fallback — disabled by default (loop handles scheduling)
;[program:cron]
;command=/usr/sbin/crond -f
;autostart=false
;autorestart=false
